[project]
name = "openevidence-mvp"
version = "0.1.1"
description = "OpenEvidence 风格证据智能助手 MVP —— 赛道1 数据集采集 + 赛道3 对比评估（高血压 + 血脂）"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "rank-bm25>=0.2.2",
    "jsonschema>=4.18",
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pytest>=8.0",
]

[project.optional-dependencies]
retrieval = ["rank-bm25>=0.2", "chromadb>=0.4"]
test = ["pytest>=7.0"]
ui = ["streamlit>=1.40"]
embedding_local = ["sentence-transformers>=4.0"]

[tool.setuptools.packages.find]
include = ["ingestion*", "core*", "evaluation*", "generation*", "retrieval*"]
