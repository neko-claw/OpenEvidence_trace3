# OpenEvidence 赛道3 全局配置（所有关键参数版本化，修改后更新 version）
project: track3
config_version: v0.1.2    # v0.1.2: B3 review 修复（E 为 P0-STRESS、MMR/来源上限配置化、K1 分层占位、离线回放）

llm:
  provider: deepseek            # 从环境变量 DEEPSEEK_API_KEY 读取 key
  base_url: https://api.deepseek.com
  model: deepseek-chat          # 生成模型快照，四条件必须一致
  judge_model: qwen3.8-max      # judge 与生成不同家族（deepseek 生成 / qwen 评审）降低同源偏差
  judge_provider: dashscope     # judge 走独立 provider（见下方 judge 段）
  temperature: 0.3
  max_tokens: 1500
  timeout: 120
  retries: 3

# judge 独立 provider：qwen3.8-max（DashScope），与生成模型 deepseek 不同家族
judge:
  provider: dashscope
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model: qwen3.8-max
  api_key_env: DASHSCOPE_API_KEY
  temperature: 0.0
  max_tokens: 1500
  timeout: 120
  retries: 2

embedding:
  # backend: api | local | fallback
  #   api      -> DashScope qwen3.7-text-embedding（OpenAI 兼容接口，需 DASHSCOPE_API_KEY）
  #   local    -> sentence-transformers 本地模型，首次运行自动下载
  #   fallback -> 不依赖任何模型，基于词表哈希（仅保证代码可跑，质量差）
  backend: api
  api_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_model: "qwen3.7-text-embedding"
  api_key_env: DASHSCOPE_API_KEY
  local_model: "BAAI/bge-small-zh-v1.5"
  dim: 1024
  batch_size: 20    # qwen3.7-text-embedding 单请求上限 20 条

retrieval:
  k_bm25: 50
  k_vec: 50
  k_rrf: 100
  k_final: 8
  rrf_k: 60
  # 全文增强层（Europe PMC OA 分块 12023 条）接入检索：true 时 EvidenceStore 一并索引
  include_fulltext: true
  # LLM Wiki 主题页（data/processed/wiki/*.md）作为 BM25 文档接入检索（规划 §5.3）
  include_wiki: true
  # K1 分层（实施规划 §4.3.2）：RRF 合并后先特征重排到 K1 条，再 MMR 选 k_final
  # P0 当前实现：特征重排作用在全量 RRF 候选上；K1 为 A4 调参预留，默认 None=不截断
  k1_rerank: null

rerank:
  # 特征加权重排权重（v0.1 起始值，只用开发题调参，正式题冻结）
  weights:
    semantic: 0.30
    lexical: 0.20
    pico_match: 0.15
    evidence_level: 0.15
    freshness: 0.10
    source_quality: 0.10
    redundancy: -0.15
  mmr_lambda: 0.7
  # 来源/单文档上限（实施规划 §4.3.2 初始值）
  max_per_source: 4      # 同一来源类型最多进入上下文的 chunk 数
  max_per_doc: 2         # 同一篇文献最多进入上下文的 chunk 数

generation:
  prompt_version: v1
  retrieval_quality_threshold: 0.015   # 检索质量（RRF 最高分）低于该值 -> REFUSE
                                     # RRF top1 约 1/(60+1)≈0.016，双源命中更高

evaluation:
  conditions: [A, B, C, D]      # E 为 P0 必做（仅 STRESS 压力题 C/E 对照，实施规划 §2.1/§6.2），
                               # 需显式 --conditions ... E 并在 STRESS 题集上运行；A2 可选，需显式启用
  random_order_seed: 42
  judge_model: null             # 覆盖 llm.judge_model 时填写

# A2 通用搜索对照（B3 交付物，可选条件）
# 启用方式：CLI 传 --conditions A A2 B ...，或 a2.enabled=true 使 A2 默认进入条件列表
# provider=mock 时无需任何 key，离线模拟通用搜索（结果标注 simulated，仅用于流程演示/测试）
# provider=serper 时需设置环境变量 SERPER_API_KEY（Google Serper API）
a2:
  enabled: false
  provider: mock               # mock | serper
  api_base_url: https://google.serper.dev
  api_key_env: SERPER_API_KEY
  max_searches: 1              # 每题固定搜索次数预算（不可突破）
  max_results_per_search: 5    # 每次搜索保留结果数（不可突破）
  timeout: 20                  # 单次搜索超时（秒）
  citation_prefix: "S"         # A2 引用标识 [S#]，与项目证据 [E#] 严格区分
  cost_per_search: 0.002       # 单次搜索估算成本（美元），mock 为 0

paths:
  evidence: data/processed/evidence.jsonl
  wiki: data/processed/wiki
  questions: test_set/questions.jsonl      # 正式主集（33 DEV + 77 TEST，B2 冻结；split 字段区分 dev/test）
  questions_dev: data/questions/dev8.jsonl    # 演示样例（demo，不进正式指标）
  questions_formal: data/questions/formal12.jsonl   # 演示样例（demo，不进正式指标）
  questions_stress: test_set/stress_20.jsonl   # STRESS 正式 20 题（B2 冻结，C/E 预注册扰动）
  runs_dir: data/experiments/runs
  scores_dir: data/experiments/scores
  artifacts: artifacts
