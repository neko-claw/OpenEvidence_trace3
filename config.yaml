# OpenEvidence 赛道3 全局配置（所有关键参数版本化，修改后更新 version）
project: track3
config_version: v0.1.1    # v0.1.1: 新增 a2 通用搜索配置段（B3）

llm:
  provider: deepseek            # 从环境变量 DEEPSEEK_API_KEY 读取 key
  base_url: https://api.deepseek.com
  model: deepseek-chat          # 生成模型快照，四条件必须一致
  judge_model: deepseek-chat    # judge 与生成同家族有偏差，有条件请换成不同模型
  temperature: 0.3
  max_tokens: 1500
  timeout: 120
  retries: 3

embedding:
  # backend: api | local | fallback
  #   api      -> 走 OpenAI 兼容 embedding 接口（如 SiliconFlow），需配置 key
  #   local    -> sentence-transformers 本地模型，首次运行自动下载
  #   fallback -> 不依赖任何模型，基于词表哈希（仅保证代码可跑，质量差）
  backend: local
  api_base_url: ""              # 例如 https://api.siliconflow.cn/v1
  api_model: "BAAI/bge-m3"
  local_model: "BAAI/bge-small-zh-v1.5"
  dim: 512

retrieval:
  k_bm25: 50
  k_vec: 50
  k_rrf: 100
  k_final: 8
  rrf_k: 60

rerank:
  # 特征加权重排权重（v0.1 起始值，只用开发题调参，正式题冻结）
  weights:
    semantic: 0.30
    lexical: 0.20
    pico_match: 0.15
    evidence_level: 0.15
    freshness: 0.10
    source_quality: 0.10
    redundancy: -0.15
  mmr_lambda: 0.7

generation:
  prompt_version: v1
  retrieval_quality_threshold: 0.015   # 检索质量（RRF 最高分）低于该值 -> REFUSE
                                     # RRF top1 约 1/(60+1)≈0.016，双源命中更高

evaluation:
  conditions: [A, B, C, D]      # E 为 P1 劣化实验；A2 可选，需显式启用
  random_order_seed: 42
  judge_model: null             # 覆盖 llm.judge_model 时填写

# A2 通用搜索对照（B3 交付物，可选条件）
# 启用方式：CLI 传 --conditions A A2 B ...，或 a2.enabled=true 使 A2 默认进入条件列表
# provider=mock 时无需任何 key，离线模拟通用搜索（结果标注 simulated，仅用于流程演示/测试）
# provider=serper 时需设置环境变量 SERPER_API_KEY（Google Serper API）
a2:
  enabled: false
  provider: mock               # mock | serper
  api_base_url: https://google.serper.dev
  api_key_env: SERPER_API_KEY
  max_searches: 1              # 每题固定搜索次数预算（不可突破）
  max_results_per_search: 5    # 每次搜索保留结果数（不可突破）
  timeout: 20                  # 单次搜索超时（秒）
  citation_prefix: "S"         # A2 引用标识 [S#]，与项目证据 [E#] 严格区分
  cost_per_search: 0.002       # 单次搜索估算成本（美元），mock 为 0

paths:
  evidence: data/processed/evidence.jsonl
  wiki: data/processed/wiki
  questions_dev: data/questions/dev8.jsonl
  questions_formal: data/questions/formal12.jsonl
  runs_dir: data/experiments/runs
  scores_dir: data/experiments/scores
  artifacts: artifacts
